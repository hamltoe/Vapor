# Example vapord configuration. Copy to /etc/vapor/vapord.conf and edit.
# Command-line flags override these values.

listen_port = 8777
bind_addr = 127.0.0.1
content_root = /srv/vapor/content
# Drop folder: one subdirectory per game (zip, iso, or unpacked files).
# ISOs are wrapped into a zip under content_root; the original is left in place.
# Leave empty to disable auto-discovery.
library_root = /srv/vapor/library
discover_interval = 60
db_path = /var/lib/vapor/vapor.db
enable_registration = true
num_threads = 8
